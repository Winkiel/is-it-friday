<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Is It Friday?</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#message {
    width: 95vw;
    height: 95vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    font-weight: bold;
    line-height: 1.1;

    word-wrap: break-word;
    overflow-wrap: break-word;
}
</style>
</head>
<body>

<div id="message"></div>

<script>
const messages = {
    0: "Weekend ending soon. Please remain calm.",
    1: "Friday is 80% loading...",
    2: "Friday is visible on the horizon, but binoculars may be required. 🔭",
    3: "It's Nano-Friday™. Technically closer, emotionally still far away. 🤏",
    4: "We're almost there. It's Mini-Friday today.",
    5: "Congratulations. You've unlocked Friday. Weekend access is now available. 🎉",
    6: "Weekend in progress. Friday was a success."
};

document.getElementById("message").textContent =
    messages[new Date().getDay()];

function fitText() {
    let min = 10;
    let max = 1000;

    while (max - min > 1) {
        const size = Math.floor((min + max) / 2);
        message.style.fontSize = size + "px";

        const fits =
            message.scrollWidth <= message.clientWidth &&
            message.scrollHeight <= message.clientHeight;

        if (fits) {
            min = size;
        } else {
            max = size;
        }
    }

    message.style.fontSize = min + "px";
}

fitText();
window.addEventListener("resize", fitText);
</script>

</body>
</html>
